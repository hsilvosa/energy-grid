[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "energy-grid-intelligence"
version = "0.1.0"
description = "European electricity data ingestion, forecasting, evaluation, and serving"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "boto3>=1.35,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "lightgbm>=4.5,<5",
  "mlflow==3.15.1",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pyarrow>=18,<24",
  "joblib>=1.4,<2",
  "prometheus-client>=0.21,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "scikit-learn>=1.5,<2",
  "sqlalchemy>=2.0,<3",
  "statsmodels>=0.14,<1",
  "typer>=0.12,<1",
  "tzdata>=2024.1",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
streaming = ["confluent-kafka>=2.6,<3", "pyspark==3.5.5"]
demo = [
  "gradio>=5,<7",
  "plotly>=5,<7",
  "xgboost>=2,<4",
  "catboost>=1.2,<2",
  "huggingface-hub>=0.30,<2",
]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
]

[project.scripts]
energy-grid = "energy_grid.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/energy_grid"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["confluent_kafka.*", "pandas.*", "statsmodels.*", "pyspark.*", "pyarrow.*", "joblib.*", "lightgbm.*", "plotly.*", "gradio.*", "xgboost.*", "catboost.*", "sklearn.*", "huggingface_hub.*"]
ignore_missing_imports = true
