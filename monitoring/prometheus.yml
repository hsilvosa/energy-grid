global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: energy-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]

